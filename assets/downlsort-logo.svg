<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" shape-rendering="crispEdges" role="img" aria-label="DownLSort logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>DownLSort</title>
  <!-- tile -->
  <rect x="0" y="0" width="320" height="320" fill="#1B1D29"/>
  <rect x="10" y="10" width="300" height="300" fill="none" stroke="#4A4C5C" stroke-width="10"/>

  <!-- download arrow: shaft + stepped head -->
  <g fill="#4F6BFF">
    <rect x="140" y="40" width="40" height="90"/>
    <rect x="80"  y="130" width="160" height="10"/>
    <rect x="90"  y="140" width="140" height="10"/>
    <rect x="100" y="150" width="120" height="10"/>
    <rect x="110" y="160" width="100" height="10"/>
    <rect x="120" y="170" width="80"  height="10"/>
    <rect x="130" y="180" width="60"  height="10"/>
    <rect x="140" y="190" width="40"  height="10"/>
  </g>

  <!-- sorted bars: long to short, fading blue -->
  <rect x="60" y="225" width="200" height="20" fill="#4F6BFF"/>
  <rect x="60" y="255" width="150" height="20" fill="#7D93FF"/>
  <rect x="60" y="285" width="90"  height="10" fill="#B3C0FF"/>
</svg>
