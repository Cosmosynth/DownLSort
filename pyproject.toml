[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "downlsort"
version = "0.1.0"
description = "Organize a cluttered Downloads folder through a clean, modern GUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "customtkinter>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
downlsort = "downlsort.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
